name: Terraform Plan and Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "services/**"
      - ".github/workflows/terraform-plan-apply.yml"
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Action to run"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: infra/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enforce main branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "This workflow must run from main because the IAM trust policy only allows refs/heads/main."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-anc-terraform-prod
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Bootstrap Terraform state bucket
        run: bash ../scripts/bootstrap-state-bucket.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          terraform plan -no-color -input=false -out=tfplan
          terraform show -no-color tfplan > tfplan.txt
          {
            echo "## Terraform plan"
            echo ""
            echo '```text'
            cat tfplan.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Terraform apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: terraform apply -input=false -auto-approve tfplan
